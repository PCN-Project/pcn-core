[workspace]
resolver = "2"
members = [
    "apps/pcn",
    "apps/pcnd",
    "crates/pcn-address",
    "crates/pcn-packet",
    "crates/pcn-routing",
    "crates/pcn-transport",
    "crates/pcn-transport-udp",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "LicenseRef-PCN-SAL-1.0"

[workspace.lints.rust]
# The wire-format and packet-parsing code must never rely on `unsafe`.
unsafe_code = "forbid"
